version: '3.8'

services:
  api:
    build: .
    container_name: qflow_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-https://oiehjulozbktlapmctsr.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_VFCbkxMC6AhePvJ6N6fVUA_bT4cVkyi}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: qflow_redis
    restart: always
    ports:
      - "6379:6379"
