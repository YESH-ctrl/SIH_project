[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qflow-backend"
version = "2.4.0"
description = "Q-FLOW Intelligent Transportation & Route Optimization Control Center Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Q-FLOW Engineering Team", email = "engineering@qswarm.io" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "networkx>=3.2.1",
    "pandas>=2.2.1",
    "redis>=5.0.3",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
